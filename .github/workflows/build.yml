name: Rebuild README and site

on:
  push:
    branches: [main]
    paths: ["data/**", "scripts/build.py", "README.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m scripts.build
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "Nothing to commit"; exit 0; fi
          git config user.name  "reality-check-bot"
          git config user.email "reality-check-bot@users.noreply.github.com"
          git add README.md docs/data.json docs/data.js
          git commit -m "chore: rebuild README and site data"
          git push
