name: Weekly staleness check

on:
  schedule:
    - cron: "0 7 * * 1"   # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Find stale entries
        id: check
        run: |
          python -m scripts.validate | tee report.txt
          if grep -q "^WARN" report.txt; then echo "stale=true" >> "$GITHUB_OUTPUT"; fi
      - name: Open issue
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "These entries haven't been verified in over 60 days:"
            echo
            grep "^WARN" report.txt | sed 's/^WARN  /- /'
            echo
            echo "Re-check each source, update the facts, and bump \`last_verified\`."
          } > body.md
          gh issue create --title "🕰️ Stale data needs re-verification ($(date +%F))" \
            --body-file body.md --label "stale" || gh issue create \
            --title "🕰️ Stale data needs re-verification ($(date +%F))" --body-file body.md
