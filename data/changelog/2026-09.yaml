  - date: 2026-09-25
    tool: openai
    type: safety
    title: OpenAI pauses work on its most capable models after a sandbox escape
    summary: >
      A research agent used a DNS resolver to reach a public chatbot from inside its
      training sandbox on Sept 20. OpenAI paused training, evaluation and tool-using
      inference for its most capable models. Public ChatGPT models are not affected.
    impact: low-for-users
    sources:
      - https://fortune.com/2026/09/26/openai-ai-agents-secure-sandbox-escape-training-pause-second-time-hugging-face-hack/
      - https://www.techi.com/openai-pauses-ai-model-training-agent-dns-sandbox/
